name: .NET 10 Azure Deploy

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: dotnet publish
      # --self-contained true: .NET 10'u paketin içine gömer.
      # -r linux-x64: Azure Linux olduğu için hedef sistemi belirtiyoruz.
      run: dotnet publish BasicWeb.csproj -c Release -r linux-x64 --self-contained true -o ./publish

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'BasicWeb'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./publish